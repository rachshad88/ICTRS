# Proxy settings for every /api location (snippets/itrs-api.conf).
# Installed as /etc/nginx/snippets/itrs-api-proxy.conf by deploy/install-nginx.sh.
proxy_pass http://itrs_backend;
proxy_http_version 1.1;
# Empty, so the upstream connection stays open for the next request (keepalive in itrs.conf).
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_buffering off;

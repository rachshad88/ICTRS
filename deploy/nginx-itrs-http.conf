# http-level settings shared by both ITRS sites (nginx-itrs.conf and nginx-getregisterforms.conf).
# Installed as /etc/nginx/conf.d/itrs.conf by deploy/install-nginx.sh.

# The backend: PM2 runs one process per core on port 3000 and spreads connections over them
# (backend-ts/ecosystem.config.js). nginx keeps idle connections open for reuse instead of opening
# one per request. 127.0.0.1, not localhost: the backend listens on IPv4, and localhost tries ::1 first.
upstream itrs_backend {
	server 127.0.0.1:3000;
	keepalive 32;
}

# Sign-in and sign-up floods are turned away here, before they reach Node. Per client address.
# These are generous for people: the backend's own throttle (middleware/loginThrottle.ts) still
# locks an address after 5 wrong passwords, and allows 5 sign-ups an hour.
limit_req_zone $binary_remote_addr zone=itrs_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=itrs_signup:10m rate=3r/m;
limit_req_status 429;
limit_req_log_level warn;

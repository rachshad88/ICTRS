# Security headers for the files nginx serves itself (the app, scripts, styles, fonts, icons).
# Installed as /etc/nginx/snippets/itrs-security-headers.conf by deploy/install-nginx.sh and included
# in each static location of both ITRS sites (nginx-itrs.conf and the getregisterforms.online vhost).
# It is included per location because a location that sets any add_header of its own (Cache-Control)
# drops every add_header from the server block.
# /api and /socket.io are not included: the backend sends these headers itself (helmet, index.ts).
#
# The main Content Security Policy is in index.html (vite.config.ts), since it has to carry the
# hashes of each build's inline scripts. This one adds what a page can't set for itself: which
# sites may frame ITRS (none but itself). Browsers apply both policies.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
# ITRS uses none of these.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

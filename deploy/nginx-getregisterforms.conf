# Public site for ITRS (getregisterforms.online, Let's Encrypt certificate). Installed as
# /etc/nginx/sites-available/getregisterforms.online by deploy/install-nginx.sh. Keep the ACME webroot
# location: certbot renews the certificate through it.

# getregisterforms.online — dedicated vhost so this domain gets a real
# Let's Encrypt certificate instead of the self-signed itrs.dave fallback.
# The site content is the same ITRS app (root /var/www/itrs, /api → :3000).
# HTTP-01 challenge path is served from /var/www/letsencrypt over plain HTTP.

server {
	listen 80;
	listen [::]:80;

	server_name getregisterforms.online www.getregisterforms.online;
	server_tokens off;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/letsencrypt;
		default_type "text/plain";
		try_files $uri =404;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

# HTTPS vhost for getregisterforms.online — same ITRS app as the default
# server, but with the real Let's Encrypt certificate.
server {
	listen 443 ssl;
	listen [::]:443 ssl;

	server_name getregisterforms.online www.getregisterforms.online;

	ssl_certificate /etc/letsencrypt/live/getregisterforms.online/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/getregisterforms.online/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers HIGH:!aNULL:!MD5;
	ssl_session_cache shared:SSL:10m;

	client_max_body_size 100m;

	server_tokens off;

	# Static locations include the full security header set (ITRS deploy/nginx-itrs-headers.conf).
	add_header Strict-Transport-Security "max-age=31536000" always;

	brotli on;
	brotli_static on;
	brotli_comp_level 6;
	brotli_min_length 256;
	brotli_types text/plain text/css text/javascript application/javascript application/json
		application/manifest+json image/svg+xml text/xml application/xml;

	gzip on;
	gzip_static on;
	gzip_comp_level 6;
	gzip_min_length 256;
	gzip_vary on;
	gzip_proxied any;
	gzip_types text/plain text/css text/javascript application/javascript application/json
		application/manifest+json image/svg+xml text/xml application/xml;

	root /var/www/itrs;

	location / {
		try_files $uri $uri/ /index.html;
		add_header Cache-Control "no-cache" always;
		include snippets/itrs-security-headers.conf;
	}

	location /assets/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
		include snippets/itrs-security-headers.conf;
	}

	location ^~ /fonts/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
		include snippets/itrs-security-headers.conf;
	}

	location = /solano-logo.png {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=604800";
		include snippets/itrs-security-headers.conf;
	}

	location = /favicon.ico {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=604800";
		include snippets/itrs-security-headers.conf;
	}

	location = /apple-touch-icon.png {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=604800";
		include snippets/itrs-security-headers.conf;
	}

	# API proxy: body limits and sign-in rate limits (nginx-itrs-api.conf).
	include snippets/itrs-api.conf;

	location /socket.io {
		proxy_pass http://itrs_backend;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
	}

	location /health {
		proxy_pass http://itrs_backend/api/health;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

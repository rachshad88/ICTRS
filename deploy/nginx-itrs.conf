# nginx site for ITRS. Installed as /etc/nginx/sites-available/default (see deploy/README.md).
# The frontend is served as built files from /var/www/itrs (deploy/deploy-frontend.sh);
# /api and /socket.io go to the backend on port 3000.

# Redirect all HTTP traffic to HTTPS
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	server_name _;

	return 301 https://$host$request_uri;
}

# HTTPS server for ITRS
server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;

	server_name _;

	ssl_certificate /etc/ssl/certs/itrs.crt;
	ssl_certificate_key /etc/ssl/private/itrs.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers HIGH:!aNULL:!MD5;
	ssl_session_cache shared:SSL:10m;

	# Uploads: up to 10 files of 10 MB each (the backend enforces the per-file limit).
	client_max_body_size 100m;

	add_header Strict-Transport-Security "max-age=31536000" always;

	# Compression. Brotli needs the Ubuntu modules (see deploy/README.md):
	#   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
	# Built files ship pre-compressed (.br at level 11, .gz at level 9; deploy-frontend.sh), and
	# the *_static lines serve those as-is. Anything else, mainly /api JSON, is compressed on the
	# fly: Brotli 6 for browsers that accept it, gzip 6 for the rest. Images, PDFs and uploads are
	# already compressed and are left alone.
	brotli on;
	brotli_static on;
	brotli_comp_level 6;
	brotli_min_length 256;
	brotli_types text/plain text/css text/javascript application/javascript application/json
		application/manifest+json image/svg+xml text/xml application/xml;

	gzip on;
	gzip_static on;
	gzip_comp_level 6;
	gzip_min_length 256;
	gzip_vary on;
	gzip_proxied any;
	gzip_types text/plain text/css text/javascript application/javascript application/json
		application/manifest+json image/svg+xml text/xml application/xml;

	root /var/www/itrs;

	# The app is a single-page app: unknown paths (e.g. /reports) load index.html.
	# index.html must never be cached, or browsers keep loading an old build.
	location / {
		try_files $uri $uri/ /index.html;
		add_header Cache-Control "no-cache" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
	}

	# Built JS/CSS have content hashes in their names, so they can be cached for good.
	# (No "always" on Cache-Control: a 404 for a missing file must not be cached.)
	location /assets/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header Strict-Transport-Security "max-age=31536000" always;
	}

	# Self-hosted fonts are cached for good, like /assets/. Their names carry no content hash, so
	# never edit a font file in place: give a changed font a new file name (and update fonts.css),
	# or browsers keep the old one for a year.
	location ^~ /fonts/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header Strict-Transport-Security "max-age=31536000" always;
	}

	# The seal shows on nearly every page. A week without re-checking; a replaced logo reaches
	# returning visitors within that week (or at once on a hard refresh).
	location = /solano-logo.png {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=604800";
		add_header Strict-Transport-Security "max-age=31536000" always;
	}

	# API proxy to backend
	location /api {
		proxy_pass http://localhost:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
	}

	# Socket.IO proxy to backend
	location /socket.io {
		proxy_pass http://localhost:3000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
	}

	# Health check endpoint
	location /health {
		proxy_pass http://localhost:3000/api/health;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

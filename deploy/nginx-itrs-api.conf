# The /api locations, included in the server block of both ITRS sites.
# Installed as /etc/nginx/snippets/itrs-api.conf by deploy/install-nginx.sh.

# Ordinary API calls are small JSON; only the upload routes below take files.
location /api {
	client_max_body_size 1m;
	include snippets/itrs-api-proxy.conf;
}

location = /api/auth/login {
	client_max_body_size 1m;
	limit_req zone=itrs_login burst=10 nodelay;
	include snippets/itrs-api-proxy.conf;
}

location = /api/auth/signup {
	client_max_body_size 1m;
	limit_req zone=itrs_signup burst=5 nodelay;
	include snippets/itrs-api-proxy.conf;
}

# Media request forms (up to 10 files of 10 MB) and MOV photos (3 of 20 MB); multer enforces the
# per-file limits.
location ~ ^/api/(multimedia|digitalmedia|printmaterials)/create_request$ {
	client_max_body_size 100m;
	include snippets/itrs-api-proxy.conf;
}

location = /api/requests/request_finish {
	client_max_body_size 100m;
	include snippets/itrs-api-proxy.conf;
}

# The sign-in page reads Retry-After to pause its button (pages/Login.tsx); without it the page
# would assume the backend's 15-minute lockout.
error_page 429 = @itrs_too_many;
location @itrs_too_many {
	default_type application/json;
	add_header Retry-After 60 always;
	return 429 '{"error":"Too many attempts from this computer. Wait a minute and try again."}';
}
